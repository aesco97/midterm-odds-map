<style>
/* Site-wide top bar. Injected by scripts/build.py at the top of <body> on every page; the page's own <header> keeps its title. */
.topnav{display:flex;align-items:center;gap:18px;padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px;font-family:var(--body)}
.topnav .brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em;text-decoration:none;color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}

.topnav ul::-webkit-scrollbar{display:none}
.topnav a.nl{display:block;padding:6px 10px;border-radius:6px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}

.topnav .asof{margin-left:auto;font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
@media (max-width:700px){.topnav{gap:10px}.topnav .asof{display:none}.topnav a.nl{padding:6px 8px;font-size:13px}}
