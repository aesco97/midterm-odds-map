# Pulls the latest Polymarket prices every hour and rebuilds index.html.
# A commit is only made when the odds actually changed (the feed itself refreshes
# about twice a day); each such run also adds a snapshot to data/history/, which
# feeds the deltas and sparklines. Each push to main redeploys the site on Vercel.
name: Refresh odds

on:
  schedule:
    - cron: "7 * * * *"   # hourly, a few minutes past the hour (GitHub cron drifts a little)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch odds and rebuild the page
        run: python3 scripts/fetch_odds.py
      - name: Commit if anything changed
        run: |
          git add -A data index.html embed.html data.html
          if git diff --cached --quiet; then
            echo "Odds unchanged; nothing to commit."
            exit 0
          fi
          stamp=$(python3 -c "import json; print(json.load(open('data/odds.json'))['updated'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh odds ($stamp)"
          git push
